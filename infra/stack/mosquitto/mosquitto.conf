# Broker MQTT de la table Sentinel-X
#
# Deux ecouteurs, deux mondes :
#   - 8883 : MQTTS depuis les ESP8266 (reseau uap0), TLS + CA privee
#   - 1883 : MQTT interne au reseau Docker, jamais publie sur l hote
#
# Aucun ecouteur anonyme, aucune donnee en clair hors du conteneur.

allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Interne : reserve au pont et aux services de la stack ------------------
listener 1883

# --- Expose aux ESP8266 : TLS obligatoire -----------------------------------
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
# Exige un certificat client signe par notre CA (desactive tant que le
# firmware DEV ne presente pas encore de certificat d appareil).
# require_certificate true
# use_identity_as_username false

# --- WebSocket : reserve au tableau de bord (loopback uniquement) -----------
# Un navigateur ne sait pas ouvrir du MQTT brut : il passe par du WebSocket,
# ici en TLS pour rester coherent avec le reste.
listener 8884
protocol websockets
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
